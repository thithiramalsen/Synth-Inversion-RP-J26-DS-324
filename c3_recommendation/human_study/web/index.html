<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Local rehearsal of the C3 synthesizer patch recommendation study.">
  <title>C3 · Listening study rehearsal</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div class="rehearsal">LOCAL REHEARSAL · Not collecting research responses</div>
  <header><a class="brand" href="/">C3 <span>/ Listening study</span></a><span id="session-code"></span></header>
  <main>
    <div id="progress" aria-label="Study progress"></div>

    </div>
    <p class="privacy">No microphone, camera or screen recording. Please keep names, emails and other personal details out of comments.</p>
  </main>
  <footer>C3 · Patch recommendation study · Rehearsal version 2 · Phase 7 settings</footer>
