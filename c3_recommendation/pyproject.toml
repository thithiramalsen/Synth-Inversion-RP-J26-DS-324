[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c3"
version = "0.4.0"
description = "C3 v4 - diversity-aware set-level synth patch recommendation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Lets `python -m pytest c3_recommendation/tests_v4` run without installing the package.
pythonpath = ["src"]
testpaths = ["tests_v4"]
