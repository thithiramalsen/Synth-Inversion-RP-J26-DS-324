<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C1 Timbre Dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2433; --quiet: #5b6577; --line: #dde2ea; --soft: #eef1f5;
  --accent: #2f6fdb; --warn-bg: #fff4e0; --warn-ink: #7a4a00; --good: #1f8a4c; --bad: #c2412d;
  --c-brightness: #d9930d; --c-roughness: #c2412d; --c-percussiveness: #2f6fdb; --c-sustainedness: #1f8a4c;
  --c-features19: #2f6fdb; --c-clap512: #9b5de5; --c-combined: #1f8a4c;
  --base: #9aa3b2; --pos: 31, 138, 76; --neg: 194, 65, 45;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1b2029; --ink: #e7ebf2; --quiet: #9aa4b5; --line: #2c3340; --soft: #232a35;
    --accent: #6ea0ff; --warn-bg: #3a2c10; --warn-ink: #f3cf8a; --good: #4cc483; --bad: #ff7a63;
    --c-brightness: #f0b33a; --c-roughness: #ff7a63; --c-percussiveness: #6ea0ff; --c-sustainedness: #4cc483;
    --c-features19: #6ea0ff; --c-clap512: #c08cff; --c-combined: #4cc483;
    --base: #66707f; --pos: 76, 196, 131; --neg: 255, 122, 99;
  }
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 16px 24px 0; }
h1 { font-size: 20px; margin: 0 0 12px; }
.sub { color: var(--quiet); font-size: 13px; margin-bottom: 12px; }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
nav { display: flex; gap: 4px; overflow-x: auto; }
nav button { border: 0; background: none; color: var(--quiet); font: inherit; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
section { display: none; } section.on { display: block; }
h2 { font-size: 18px; margin: 0 0 4px; } h3 { font-size: 15px; margin: 0 0 8px; }
.lead { color: var(--quiet); margin: 0 0 20px; max-width: 820px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); }
.grid.small { grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.wide { grid-column: 1 / -1; }
.kpi { font-size: 26px; font-weight: 700; } .kpi small { font-size: 13px; font-weight: 400; color: var(--quiet); }
.muted { color: var(--quiet); font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--quiet); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll { overflow-x: auto; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--soft); }
.tag.good { color: var(--good); } .tag.bad { color: var(--bad); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
svg text { fill: var(--ink); font: 12px system-ui, sans-serif; } svg .q { fill: var(--quiet); }
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 4px; }
.flow span { background: var(--soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; } .flow i { color: var(--quiet); font-style: normal; }
.heat { border-collapse: separate; border-spacing: 3px; }
.heat td { text-align: center; border: 0; border-radius: 6px; cursor: pointer; font-variant-numeric: tabular-nums; min-width: 92px; }
.heat td.sel { outline: 2px solid var(--accent); }
.heat th { border: 0; }
.cmp { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
.cmp .stack { display: grid; gap: 16px; min-width: 0; }
.cmp .side { position: sticky; top: 16px; }
.legend { display: grid; gap: 4px; font-size: 13px; margin-bottom: 8px; }
@media (max-width: 980px) { .cmp { grid-template-columns: 1fr; } .cmp .side { position: static; } }
.pair { display: grid; gap: 16px; grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .pair { grid-template-columns: 1fr; } }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--soft); }
.list { max-height: 420px; overflow-y: auto; }
.list tr[data-id] { cursor: pointer; } .list tr.sel td { background: var(--soft); }
.err { color: var(--bad); }
audio { width: 100%; margin: 6px 0; }
@media (max-width: 640px) { header { padding: 12px 16px 0; } main { padding: 16px 16px 40px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>C1 Timbre Descriptors</h1>
  <div class="sub" id="sub">Loading…</div>
  <nav id="nav"></nav>
</header>
<main>
  <section id="try"></section>
  <section id="comparison"></section>
  <section id="effects"></section>
</main>
<script>
const TABS = [["try", "Predict the sound"], ["comparison", "Model comparison"], ["effects", "Control effects"]];
const LABEL = { brightness: "Brightness", roughness: "Roughness", percussiveness: "Percussiveness", sustainedness: "Sustainedness" };
const MODEL = { features19: "Ridge (19 audio features)", clap512: "CLAP + Ridge", combined: "Features + CLAP + Ridge" };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const color = t => css(`--c-${t}`);
const f = (x, d = 2) => x == null ? "–" : (Math.abs(x) < 0.5 * 10 ** -d ? 0 : Number(x)).toFixed(d);
const sgn = (x, d = 2) => x == null ? "–" : `${x >= 0 ? "+" : ""}${f(x, d)}`;
const pct = x => x == null ? "–" : `${Math.round(x * 100)}%`;
const svg = (w, h, body, label) => `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${label || ""}">${body}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let S;

function tabs() {
  const nav = document.getElementById("nav");
  TABS.filter(([id]) => id !== "comparison" || S.comparison).forEach(([id, name]) => {
    const b = document.createElement("button");
    b.textContent = name; b.dataset.id = id; b.onclick = () => show(id);
    nav.append(b);
  });
  show(location.hash.slice(1) || "try");
}
function show(id) {
  if (!document.querySelector(`nav button[data-id="${id}"]`)) id = "try";
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
  history.replaceState(null, "", `#${id}`);
}

// ---------------------------------------------------------------- charts
function groupedBars(groups, series, max, label) {  // groups: [{label, values:{key:v}}], series: [{key,name,color}]
  const W = 350, L = 104, R = 40, bh = 16, gap = 5, groupH = series.length * (bh + gap) + 22, H = groups.length * groupH + 34;
  const x = v => L + (W - L - R) * Math.max(0, v) / max;
  let g = "";
  for (let v = 0; v <= max + 1e-9; v += 0.25) g += `<line x1="${x(v)}" x2="${x(v)}" y1="0" y2="${H - 28}" stroke="${css("--line")}"/><text class="q" x="${x(v)}" y="${H - 12}" text-anchor="middle">${v.toFixed(2)}</text>`;
  groups.forEach((gr, i) => {
    const y0 = 6 + i * groupH;
    g += `<text x="0" y="${y0 + groupH / 2 - 6}">${gr.label}</text>`;
    series.forEach((s, j) => {
      const y = y0 + j * (bh + gap), v = gr.values[s.key];
      g += `<rect x="${L}" y="${y}" width="${Math.max(1, x(v) - L)}" height="${bh}" rx="3" fill="${s.color}"><title>${s.name}: ${f(v)}</title></rect>`;
      g += `<text x="${x(v) + 6}" y="${y + 11}">${f(v)}</text>`;
    });
  });
  return svg(W, H, g, label);
}
function scoreBars(scores, observed) {  // 1-7 bars per descriptor, optional listener marker
  const W = 560, rowH = 40, L = 130, R = 50, H = S.traits.length * rowH + 26;
  const X = v => L + (W - L - R) * (Math.min(7, Math.max(1, v)) - 1) / 6;
  let g = "";
  for (let v = 1; v <= 7; v++) g += `<line x1="${X(v)}" x2="${X(v)}" y1="8" y2="${H - 20}" stroke="${css("--line")}"/><text class="q" x="${X(v)}" y="${H - 6}" text-anchor="middle">${v}</text>`;
  S.traits.forEach((t, i) => {
    const y = 12 + i * rowH, v = scores[t];
    g += `<text x="0" y="${y + 14}">${LABEL[t]}</text>`;
    g += `<rect x="${X(1)}" y="${y + 2}" width="${Math.max(2, X(v) - X(1))}" height="16" rx="4" fill="${color(t)}" fill-opacity="0.85"/>`;
    g += `<text x="${X(v) + 6}" y="${y + 14}" style="font-weight:600">${f(v, 1)}</text>`;
    if (observed) g += `<line x1="${X(observed[t])}" x2="${X(observed[t])}" y1="${y - 2}" y2="${y + 22}" stroke="${css("--ink")}" stroke-width="2.5"><title>listener mean ${f(observed[t])}</title></line>`;
  });
  return svg(W, H, g, "predicted descriptor scores");
}

// ---------------------------------------------------------------- tabs
function comparisonTab() {
  const C = S.comparison, s = document.getElementById("comparison");
  if (!C) return;
  const keys = ["features19", "clap512"], alts = ["clap512"];
  const series = keys.map(k => ({ key: k, name: MODEL[k], color: color(k) }));
  const groups = S.traits.map(t => ({ label: LABEL[t], values: Object.fromEntries(keys.map(k => [k, C.rows[t][k].cv_r2.mean])) }));
  const legend = series.map(m => `<div><span class="dot" style="background:${m.color}"></span>${m.name}</div>`).join("");
  const mean = (k, get) => S.traits.reduce((a, t) => a + get(C.rows[t][k]), 0) / S.traits.length;
  const delta = (d, lowerBetter) => { const good = lowerBetter ? d < 0 : d > 0;
    return ` <span style="font-size:12px;color:${Math.abs(d) < 0.005 ? "var(--quiet)" : good ? "var(--good)" : "var(--bad)"}">(${sgn(d)})</span>`; };
  const name = k => `<span class="dot" style="background:${color(k)}"></span>${MODEL[k]}${k === "features19" ? ' <span class="tag good">main model</span>' : ""}`;

  const metricTable = (title, get, lowerBetter, digits, note) => {
    let h = `<h3>${title}</h3><table><tr><th>Model</th><th class="num">Inputs</th>${S.traits.map(t => `<th class="num">${LABEL[t]}</th>`).join("")}<th class="num">Average</th></tr>`;
    keys.forEach(k => {
      h += `<tr><td>${name(k)}</td><td class="num">${C.rows[S.traits[0]][k].inputs}</td>`;
      [...S.traits, "avg"].forEach(t => {
        const v = t === "avg" ? mean(k, get) : get(C.rows[t][k]);
        const ref = t === "avg" ? mean("features19", get) : get(C.rows[t].features19);
        h += `<td class="num"><b>${f(v, digits)}</b>${k === "features19" ? "" : delta(v - ref, lowerBetter)}</td>`;
      });
      h += "</tr>";
    });
    return h + "</table>";
  };

  s.innerHTML = `<h2 style="margin-bottom:16px">Model comparison</h2>
  <div class="cmp">
   <div class="stack">
    <div class="card scroll">${metricTable("Cross-validated R²", r => r.cv_r2.mean, false, 2)}</div>
    <div class="card scroll">${metricTable("Held-out test error, MAE", r => r.test_mae, true, 2)}</div>
   </div>
   <div class="card side"><h3>Cross-validated R²</h3><div class="legend">${legend}</div>${groupedBars(groups, series, 1, "model comparison")}</div>
  </div>`;
}

function effects() {
  const s = document.getElementById("effects");
  if (!S.effects) { s.innerHTML = `<h2>Control effects</h2><p class="lead">No control-effect run found for this model.</p>`; return; }
  const rows = S.effects.summary, ctrls = [...new Set(rows.map(r => r.control))];
  const get = (c, t) => rows.find(r => r.control === c && r.descriptor === t);
  const max = Math.max(...rows.map(r => Math.abs(r.mean_per_10pct)));
  const bg = v => `rgba(${v >= 0 ? css("--pos") : css("--neg")}, ${Math.min(0.85, 0.08 + Math.abs(v) / max * 0.8)})`;
  let h = `<table class="heat"><tr><th></th>${S.traits.map(t => `<th style="text-align:center">${LABEL[t]}</th>`).join("")}</tr>`;
  ctrls.forEach(c => h += `<tr><th>${c}</th>${S.traits.map(t => { const r = get(c, t); return `<td data-c="${c}" data-t="${t}" style="background:${bg(r.mean_per_10pct)}">${sgn(r.mean_per_10pct)}</td>`; }).join("")}</tr>`);
  h += "</table>";
  s.innerHTML = `<h2>Which control changes which descriptor</h2>
  <p class="lead">Mean predicted change per +10% of a control's range, one control moved at a time on ${S.effects.bases} base patches (${S.effects.renders.toLocaleString()} renders). Green = up, red = down. Click a cell for its reliability.</p>
  <div class="grid"><div class="card scroll wide">${h}</div><div class="card" id="cell"><h3>Select a cell</h3><p class="muted">Shows how consistent the effect is across patches.</p></div></div>`;
  s.querySelectorAll(".heat td").forEach(td => td.onclick = () => {
    s.querySelectorAll(".heat td").forEach(x => x.classList.remove("sel")); td.classList.add("sel");
    const r = get(td.dataset.c, td.dataset.t);
    document.getElementById("cell").innerHTML = `<h3>${r.control} → ${LABEL[r.descriptor]}</h3><table>
     <tr><td>Mean per +10%</td><td class="num"><b>${sgn(r.mean_per_10pct)}</b></td></tr>
     <tr><td>SD across patches</td><td class="num">${f(r.sd_across_bases)}</td></tr>
     <tr><td>Same direction at +10%</td><td class="num">${pct(r.share_same_sign_at_plus10)}</td></tr>
     <tr><td>+20% ÷ +10% (2 = linear)</td><td class="num">${f(r.linearity_ratio_20_vs_10)}</td></tr>
     <tr><td>Up + down (0 = symmetric)</td><td class="num">${f(r.asymmetry_up_plus_down)}</td></tr>
     <tr><td>Base patches</td><td class="num">${r.n_bases}</td></tr></table>
     <p class="muted">${Math.abs(r.mean_per_10pct) < 0.05 ? "Little average effect." : r.share_same_sign_at_plus10 >= 0.9 ? "Consistent direction across patches." : "Direction depends on the patch."}</p>`;
  });
}

function tryTab() {
  const s = document.getElementById("try");
  s.innerHTML = `<h2>Predict the sound</h2>
  <p class="lead">Upload any WAV file to predict its four descriptors live with the trained model, or play a held-out test sound and compare the model with the listener mean.</p>
  <div class="pair">
   <div class="card"><h3>Upload a WAV</h3>
    <div class="drop" id="drop" tabindex="0" role="button"><b>Drop a WAV file here</b><div class="muted">or click to choose · mono or stereo · best: 3 s Vital render at 44.1 kHz</div></div>
    <input type="file" id="file" accept=".wav,audio/wav" hidden></div>
   <div class="card" id="result"><h3>Prediction</h3><p class="muted">Upload a file or pick a test sound below.</p></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Held-out test sounds (${S.test_sounds.length})</h3><p class="muted">Click a sound to play it. In the chart, the tick marks the listener mean and the bar the model's prediction (trained without this sound).</p>
   <div class="list scroll"><table id="tests"><tr><th>Sound</th><th>Role</th>${S.traits.map(t => `<th class="num">${LABEL[t]}<br><span class="muted">listeners → model</span></th>`).join("")}</tr>
   ${S.test_sounds.map(x => `<tr data-id="${x.sample_id}"><td>${x.sample_id}</td><td>${x.role}</td>${S.traits.map(t => `<td class="num">${f(x.observed[t], 1)} → ${f(x.predicted[t], 1)}</td>`).join("")}</tr>`).join("")}
   </table></div></div>`;
  const drop = document.getElementById("drop"), file = document.getElementById("file");
  drop.onclick = () => file.click();
  drop.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } };
  file.onchange = () => { if (file.files[0]) upload(file.files[0]); file.value = ""; };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
  s.querySelectorAll("#tests tr[data-id]").forEach(tr => tr.onclick = () => {
    s.querySelectorAll("#tests tr").forEach(x => x.classList.remove("sel")); tr.classList.add("sel");
    const x = S.test_sounds.find(z => z.sample_id === tr.dataset.id);
    document.getElementById("result").innerHTML = `<h3>${x.sample_id} <span class="tag">${x.role || "study"} · held out</span></h3>
      <audio controls autoplay src="/audio/${x.sample_id}.wav"></audio>${scoreBars(x.predicted, x.observed)}
      <p class="muted">Corpus source ${esc(x.source)}. Predicted by the model trained without this sound.</p>`;
  });
}

async function upload(fileObj) {
  const box = document.getElementById("result");
  box.innerHTML = `<h3>${esc(fileObj.name)}</h3><p class="muted">Extracting 19 features and predicting…</p>`;
  try {
    const res = await fetch("/api/predict", { method: "POST", headers: { "X-Filename": encodeURIComponent(fileObj.name) }, body: fileObj });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error || "Prediction failed");
    const url = URL.createObjectURL(fileObj);
    const notes = r.notes.length ? `<p class="muted">Note: ${r.notes.map(esc).join("; ")}.</p>` : "";
    const support = r.weak_support
      ? `<span class="tag bad">weak support</span> <span class="muted">Unlike every training sound (distance ${f(r.support_distance)} &gt; ${f(r.support_threshold)}): treat as an extrapolation.</span>`
      : `<span class="tag good">within training range</span> <span class="muted">distance ${f(r.support_distance)} ≤ ${f(r.support_threshold)}</span>`;
    const contrib = `<div class="scroll"><table><tr><th>Descriptor</th><th class="num">Average</th><th class="num">Spectral</th><th class="num">Temporal</th><th class="num">Modulation</th><th class="num">Score</th></tr>${S.traits.map(t => {
      const c = r.contributions[t]; return `<tr><td>${LABEL[t]}</td><td class="num">${f(c.intercept)}</td><td class="num">${sgn(c.spectral)}</td><td class="num">${sgn(c.temporal)}</td><td class="num">${sgn(c.modulation)}</td><td class="num"><b>${f(r.raw[t])}</b></td></tr>`; }).join("")}</table></div>`;
    box.innerHTML = `<h3>${esc(r.name)} <span class="tag">uploaded · ${f(r.duration_s)} s</span></h3><audio controls src="${url}"></audio>
      ${scoreBars(r.scores)}<p>${support}</p>${notes}
      <details><summary class="muted">Why this prediction (feature-group contributions)</summary>${contrib}<p class="muted">Score = training average + the contribution of each feature group (raw, before clipping to 1–7).</p></details>`;
  } catch (e) {
    box.innerHTML = `<h3>${esc(fileObj.name)}</h3><p class="err">${esc(e.message)}</p>`;
  }
}

fetch("/api/summary").then(r => r.json()).then(data => {
  S = data;
  document.getElementById("sub").remove();
  tryTab(); comparisonTab(); effects(); tabs();
}).catch(() => document.getElementById("sub").textContent = "Could not load results. Is serve_dashboard.py running?");
</script>
</body>
</html>
